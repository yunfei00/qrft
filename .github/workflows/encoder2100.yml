name: QRFT2100 Source Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qrft/encoder2100/**'
      - 'tests/test_encoder2100.py'
      - 'scripts/encoder2100_acceptance.py'
      - '.github/workflows/encoder2100.yml'

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --all-extras --group dev
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - name: Full regression, actual PNG/ConPTY and player state tests
        run: uv run --no-sync pytest -q
      - name: Independent ZXing PNG/MP4, retransmission, generation and 1 GiB streaming evidence
        run: uv run --no-sync python scripts/encoder2100_acceptance.py benchmark --root temp/encoder2100-ci
      - name: Upload source evidence only (no EXE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QRFT2100-source-evidence
          path: |
            temp/encoder2100-ci/report.json
            temp/encoder2100-ci/synthetic.mp4
            temp/encoder2100-ci/benchmark-png/
            temp/encoder2100-ci/retransmit/
          if-no-files-found: warn
