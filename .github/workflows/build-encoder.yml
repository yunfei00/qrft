name: Windows Encoder EXE

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 安装 Python 3.12
        run: uv python install 3.12
      - name: 安装编码器与打包依赖
        run: uv sync --locked --extra encoder --extra gui --extra acceptance --group dev
      - name: PyInstaller 打包编码器
        run: |
          uv run --no-sync pyinstaller --noconfirm --clean --onedir --console --name QRFT-Encoder-CLI --paths src src/qrft/encoder_cli/entrypoint.py
      - name: EXE 命令行冒烟测试
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          uv run --no-sync python scripts/encoder_smoke.py --exe dist/QRFT-Encoder-CLI/QRFT-Encoder-CLI.exe
          if ($LASTEXITCODE -ne 0) { throw "EXE interactive smoke failed" }
      - name: 上传 Windows 编码器构件
        uses: actions/upload-artifact@v4
        with:
          name: QRFT-Encoder-CLI-windows
          path: dist/QRFT-Encoder-CLI/
          if-no-files-found: error
