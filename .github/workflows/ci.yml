name: Windows Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 安装 Python
        run: uv python install 3.12
      - name: 安装核心测试依赖
        run: uv sync --locked --group dev --all-extras
      - name: 检查代码格式
        run: uv run --no-sync ruff format --check .
      - name: 静态检查
        run: uv run --no-sync ruff check .
      - name: 单元测试
        run: uv run --no-sync pytest -q
      - name: 二维码图片测试（含 encoder 可选依赖）
        run: |
          uv sync --locked --all-extras --group dev
          uv run --no-sync pytest -q tests/test_qr_image.py tests/test_encoder_cli.py
      - name: 真实二维码字节往返测试（ZXing）
        run: |
          uv sync --locked --all-extras --group dev
          uv run --no-sync pytest -q tests/test_qr_roundtrip.py
      - name: 真实 AVI 视频端到端恢复测试
        run: uv run --no-sync pytest -q tests/test_video_end_to_end.py
      - name: 控制中心 API 与 SQLite 测试
        run: |
          uv run --no-sync pytest -q tests/test_control_api.py tests/test_control_packets.py tests/test_worker.py tests/test_distributed_recovery.py
