name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q
      - name: Native decoder GUI startup and shutdown
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          uv run --no-sync python -m qrft decode --workspace "$env:RUNNER_TEMP/qrft-gui" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Decoder GUI smoke failed' }
