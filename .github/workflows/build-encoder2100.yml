name: Windows Encoder2100 Release

on:
  workflow_call:
  workflow_dispatch:

jobs:
  frozen:
    runs-on: windows-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --locked --extra encoder --extra acceptance --extra decoder --group dev
      - name: Independent console onedir and final ZIP
        run: uv run --no-sync python scripts/build_encoder2100.py --root temp/encoder2100-release
      - name: Extract exact ZIP and test frozen CLI without Python or uv on PATH
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'QRFT2100-Frozen-Evidence'
          uv run --no-sync python scripts/encoder2100_frozen_acceptance.py --zip temp/encoder2100-release/QRFT-Encoder2100-Windows-x64-v0.1.0.zip --root $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Frozen ZIP acceptance failed' }
          Copy-Item -LiteralPath (Join-Path $evidence 'frozen-report.json') -Destination temp/encoder2100-release/frozen-report.json
      - name: Upload exact tested release ZIP and machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: QRFT2100-Windows-x64-release
          path: |
            temp/encoder2100-release/*.zip
            temp/encoder2100-release/*.sha256
            temp/encoder2100-release/build.json
            temp/encoder2100-release/frozen-report.json
          if-no-files-found: error
