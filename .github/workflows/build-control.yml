name: Windows Control EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --locked --extra control --group dev
      - name: Build control EXE
        run: uv run --no-sync pyinstaller --noconfirm --clean --onedir --console --name QRFT-Control --paths src src/qrft/control/app.py
      - name: Check help and authenticated API
        shell: pwsh
        run: |
          & dist/QRFT-Control/QRFT-Control.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Control help failed" }
          $env:QRFT_API_TOKEN = "ci-test-token"
          $env:QRFT_DB_PATH = "$PWD/smoke/control.sqlite3"
          $process = Start-Process -FilePath "$PWD/dist/QRFT-Control/QRFT-Control.exe" -ArgumentList @("--port", "18787") -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              try {
                Invoke-RestMethod http://127.0.0.1:18787/health | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw "Control startup failed" }
            $headers = @{Authorization="Bearer ci-test-token"}
            $task = Invoke-RestMethod http://127.0.0.1:18787/tasks -Method Post -Headers $headers -ContentType "application/json" -Body '{"name":"smoke"}'
            if ($task.id -ne 1) { throw "Task creation failed" }
            $page = Invoke-WebRequest http://127.0.0.1:18787/
            if ($page.StatusCode -ne 200) { throw "Management page failed" }
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: QRFT-Control-windows
          path: dist/QRFT-Control/
          if-no-files-found: error
