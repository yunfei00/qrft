name: Windows Delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  delivery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev
      - name: Quality gates
        run: |
          uv run --no-sync ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build all four applications
        run: |
          uv run --no-sync pyinstaller --noconfirm --onedir --console --name QRFT-Encoder-CLI --paths src src/qrft/encoder_cli/entrypoint.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync pyinstaller --noconfirm --onedir --windowed --name QRFT-Encoder-GUI --paths src src/qrft/encoder_gui/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync pyinstaller --noconfirm --onedir --console --name QRFT-Decoder --paths src src/qrft/decoder/entrypoint.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync pyinstaller --noconfirm --onedir --console --name QRFT-Control --paths src src/qrft/control/app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frozen EXE real binary video and HTTP smoke
        run: uv run --no-sync python scripts/windows_smoke.py
      - name: Bundle documentation and checksums
        run: |
          Copy-Item README.md dist/
          Copy-Item docs dist/docs -Recurse
          Get-ChildItem dist -Filter *.exe -Recurse | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.FullName.Substring((Resolve-Path dist).Path.Length+1))"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: QRFT-Windows-delivery
          path: dist/
          if-no-files-found: error
