name: Windows applications

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --no-sync python scripts/build_windows.py
      - run: uv run --no-sync python scripts/windows_smoke.py
      - name: Bundle core documentation
        run: |
          Copy-Item README.md dist/
          Copy-Item docs dist/docs -Recurse
          $env:GITHUB_SHA | Set-Content dist/COMMIT.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: QRFT-Windows
          path: dist/
          if-no-files-found: error
